[package]
name = "skladiste"
version = "0.1.0"
edition = "2024"
description = "Content-addressed package manager on btrfs"
repository = "https://github.com/filip-hejsek/skladiste"
license = "MIT OR Apache-2.0"

[[bin]]
name = "skl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
landlock = "0.4.7"
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "net", "pipe", "process", "thread"] }
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
dbg_macro = "warn"

[lints.rust]
unreachable_pub = "warn"

# Backtraces keep file and line numbers; no variables for a debugger.
# Reduces the size of target/.
[profile.dev]
debug = "line-tables-only"

[features]
# Adds options that turn off sandboxing layers, for systems that lack them.
insecure = []
